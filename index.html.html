<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenLink FB</title>
<link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQy_oZDGgigd_VZ4JZndi7pOja1no-3cjSQkwVDcup3Q&s=10">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(-45deg,#ff0080,#7928ca,#007aff,#00e5ff,#00ff88,#ffd500);
    background-size:600% 600%;
    animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.bg1,.bg2{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    opacity:.45;
    animation:float 8s ease-in-out infinite;
}

.bg1{
    width:300px;
    height:300px;
    background:#ffffff;
    top:-60px;
    left:-60px;
}

.bg2{
    width:260px;
    height:260px;
    background:#00ffff;
    bottom:-50px;
    right:-50px;
    animation-delay:2s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-35px);
    }
}

.card{
    position:relative;
    width:360px;
    padding:30px;
    border-radius:35px;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    padding:3px;
    border-radius:35px;
    background:linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet,
        red
    );
    background-size:500% 500%;
    animation:rainbow 4s linear infinite;
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
}

@keyframes rainbow{
    0%{background-position:0%;}
    100%{background-position:500%;}
}

.glass{
    border-radius:32px;
    background:rgba(255,255,255,.16);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
    border:1px solid rgba(255,255,255,.25);
    padding:28px;
    text-align:center;
    box-shadow:
        0 15px 40px rgba(0,0,0,.25),
        inset 0 1px 1px rgba(255,255,255,.4);
}

.logo{
    font-size:70px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    50%{
        transform:translateY(-8px);
    }
}

h1{
    color:white;
    margin-top:10px;
    font-size:30px;
}

p{
    color:white;
    opacity:.9;
    margin-top:8px;
    margin-bottom:25px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    color:white;
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(90deg,#007aff,#00d4ff);
    transition:.25s;
    box-shadow:0 8px 25px rgba(0,122,255,.45);
}

button:hover{
    transform:scale(1.05);
}

button:active{
    transform:scale(.96);
}

.footer{
    margin-top:18px;
    color:white;
    font-size:13px;
    opacity:.75;
}

.spark{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:white;
    animation:spark 6s linear infinite;
}

.spark:nth-child(1){
    top:15%;
    left:10%;
}

.spark:nth-child(2){
    top:70%;
    left:80%;
    animation-delay:2s;
}

.spark:nth-child(3){
    top:30%;
    left:90%;
    animation-delay:4s;
}

@keyframes spark{
    0%{
        transform:translateY(0) scale(0);
        opacity:0;
    }
    50%{
        opacity:1;
        transform:translateY(-30px) scale(1.3);
    }
    100%{
        transform:translateY(-60px) scale(0);
        opacity:0;
    }
}
</style>

</head>
<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="card">

<div class="glass">

<div class="logo">🚀</div>

<h1>Open Link</h1>

<p>Tap the button below to continue.</p>

<button onclick="openLink()">
OPEN
</button>

<div class="footer">
Liquid Glass • Rainbow Border
</div>

</div>

<div class="spark"></div>
<div class="spark"></div>
<div class="spark"></div>

</div>

<script>
function openLink(){
    // ប្ដូរទៅ Link របស់អ្នក
    window.location.href = "https://www.tiktok.com/@rip_cdk949?lang=en";
}
</script>

</body>
</html>
