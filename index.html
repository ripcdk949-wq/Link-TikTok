<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<title>សូមឲ្យប្រឡងជាប់ទាំងអស់គ្នា ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:"Khmer OS",Arial,sans-serif;
    overflow:hidden;
}

.card{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
    width:80%;
    max-width:600px;
    box-shadow:0 0 30px #0005;
    animation:show 1.5s;
}

h1{
    color:#ff3366;
    font-size:35px;
}

p{
    font-size:22px;
    color:#333;
    line-height:1.8;
}

.heart{
    font-size:50px;
    animation:beat 1s infinite;
}

button{
    border:none;
    padding:15px 30px;
    border-radius:30px;
    background:#ff3366;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.1);
}

@keyframes beat{
    50%{
        transform:scale(1.3);
    }
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.star{
    position:absolute;
    color:white;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}
</style>
</head>

<body>

<div class="card">
    <div class="heart">❤️🫶</div>

    <h1>សូមឲ្យប្រឡងជាប់ទាំងអស់គ្នា 🎓</h1>

    <p>
    សូមជូនពរ មិត្តរួមថ្នាក់<br>
    និងមិត្តរួមសាលាទាំងអស់<br>
    ឲ្យទទួលបានលទ្ធផលល្អក្នុងការប្រឡង 💪📚
    <br><br>
    ខិតខំរៀនថ្ងៃនេះ<br>
    ដើម្បីអនាគតដ៏ភ្លឺស្វាង ChimKomPheak ✨
    </p>

    <button onclick="alert('សូមជូនពរឲ្យជាប់ទាំងអស់គ្នា ❤️🎉')">
        Good Luck 🍀
    </button>
</div>


<script>
for(let i=0;i<40;i++){
    let star=document.createElement("div");
    star.className="star";
    star.innerHTML="✨";
    star.style.left=Math.random()*100+"%";
    star.style.animationDuration=(3+Math.random()*5)+"s";
    star.style.fontSize=(10+Math.random()*25)+"px";
    document.body.appendChild(star);
}
</script>

</body>
</html>
